Description: L00205292 - Aaron Edgeworth - Template for the Three Tier
  Architecture assignment 1(b)
AWSTemplateFormatVersion: 2010-09-09

Parameters:

  # Establishing the two availability zones that will be used for the private application and database subnets. This will ensure that if one availability zone goes down, the other can still serve traffic.
  MyAvailabilityZone1:
    Type: String
    Description: The name of the first Availability Zone (e.g., eu-west-1a)
    Default: eu-west-1a

  MyAvailabilityZone2:
    Type: String
    Description: The name of the second Availability Zone (e.g., eu-west-1b)
    Default: eu-west-1b

Resources:

  # Create an S3 Bucket for simple storage. I can use it to host my static website or store files.
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      # For security reasons, public access to the bucket is blocked. all access to the bucket need to be through the CloudFront distribution.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: MyS3Bucket
        - Key: Info
          Value: Stores my index.html file

  # Create a Virtual Private Cloud to secure who can access the S3 bucket. Will need to create subnets & route tables later
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  # VPC requires an Internet Gateway to allow communication between the VPC and the internet.
  MyInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: InternetGateway
  MyAttachedGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref MyInternetGateway

  # For backup and redundancy, I will create two subnets in seperate availability zones. This will ensure that if one availability zone goes down, the other can still serve traffic.
  # These subnets will be used to host the private application servers. The public facing servers will be hosted in a seperate public subnet, which will be created later.
  MyPrivateAppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Ref MyAvailabilityZone1

  MyPrivateAppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Ref MyAvailabilityZone2

  MyPrivateDatabaseSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Ref MyAvailabilityZone1

  MyPrivateDatabaseSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.22.0/24
      AvailabilityZone: !Ref MyAvailabilityZone2

  MyPrivateWebSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.13.0/24
      AvailabilityZone: !Ref MyAvailabilityZone1

  MyPrivateWebSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.23.0/24
      AvailabilityZone: !Ref MyAvailabilityZone2
      
# Will use amazon RDS to store the index.html file for retrieval by the application servers. 
# The RDS instance will be created in the private database subnets to ensure that it is not publicly accessible.

  MyRdsService1:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: mysql
      # Will need to figure out how to ensure that the RDS instance can authenticate and launch with an aws account without sharing account credentials.
      MasterUsername: admin
      # MasterUserPassword: !Ref MyRdsPassword
      AllocatedStorage: 20

      # This is causing issues. I will need to create a security group for the RDS instance to allow access from the application servers. I will also need to create a DB subnet group to ensure that the RDS instance is created in the private database subnets.
      #
      # VPCSecurityGroups:
      #   - !GetAtt MyPrivateDatabaseSubnet1.GroupId
      # DBSubnetGroupName: !Ref MyPrivateDatabaseSubnet1
      
      # Adding MultiAZ to the RDS instance to ensure that it is highly available and can failover to the other availability zone in case of an outage. Even if the availability zone goes down it will still be able to serve traffic from the other availability zone.
      MultiAZ: true
      PubliclyAccessible: false

  MyRdsService2:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: mysql
      MasterUsername: admin
      # MasterUserPassword: !Ref MyRdsPassword
      
      # Adding MultiAZ to the RDS instance to ensure that it is highly available and can failover to the other availability zone in case of an outage. Even if the availability zone goes down it will still be able to serve traffic from the other availability zone.
      MultiAZ: true
      PubliclyAccessible: false