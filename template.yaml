Description: L00205292 - Template for the IaC Continous assessment assignment 1
AWSTemplateFormatVersion: 2010-09-09
Resources:

  # Create an S3 Bucket for simple storage. I can use it to host my static website or store files.
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: MyS3Bucket
        - Key: Info
          Value: Stores my index.html file

  # Create a Virtual Private Cloud to secure who can access the S3 bucket. Will need to create subnets & route tables later
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true

  MyS3BucketPolicy:
    # Defining a bucket policy to ensure that the S3 Buckets contents can only be accessed by the CloudFront distribution.
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MyS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # Will need to include the CloudFront Distro here when it's created
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MyS3Bucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MyCloudFrontDistribution}

  # I believe the cloudfront distribution is required so that the S3 bucket can only be accessed through the cloudfront distribution.
  MyCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: MyS3Origin
            DomainName: !GetAtt MyS3Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref MyCloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: MyS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        DefaultRootObject: index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          
  MyCloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: MyCloudFrontOAC
        Description: Access control for CloudFront to access S3 bucket
        SigningBehavior: always
        SigningProtocol: sigv4
        OriginAccessControlOriginType: s3

Outputs:
  SiteURL:
    Value: !Sub https://${MyCloudFrontDistribution.DomainName}
  BucketName:
    Value: !Ref MyS3Bucket