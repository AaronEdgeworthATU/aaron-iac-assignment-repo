Description: Template for the IaC Continous assessment assignment 1
AWSTemplateFormatVersion: 2010-09-09
Resources: 
  
  # Create an S3 Bucket for simple storage. I can use it to host my static website or store files.
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: MyS3Bucket
        - Key: Info
          Value: Stores my index.html file

  # Create a Virtual Private Cloud to secure who can access the S3 bucket. Will need to create subnets & route tables later
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true

# Defining a bucket policy to ensure that the S3 Buckets contents can only be accessed by the CloudFront distribution.
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MyS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
          # Will need to include the CloudFront Distro here when it's created
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${MyCloudFrontOAI}'
            Action: 's3:GetObject'
            Resource: !Sub '${MyS3Bucket.Arn}/*'